<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Road Rash</title>
  <link rel="stylesheet" type="text/css" href="css/reset.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }
    #menu {
      text-align: center;
    }
    .start-game {
      background: linear-gradient(to bottom, #ff6b35, #f72c25);
      border: 3px solid #fff;
      color: #fff;
      padding: 20px 40px;
      font-size: 24px;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
      transition: transform 0.2s;
    }
    .start-game:hover {
      transform: scale(1.1);
      background: linear-gradient(to bottom, #ff8555, #f74c45);
    }
    .title {
      color: #ff6b35;
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 30px;
      text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    }
    .instructions {
      color: #aaa;
      font-size: 14px;
      margin-top: 20px;
      line-height: 1.8;
    }
    #game-container {
      display: none;
    }
    canvas {
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div id="menu">
    <div class="title">ROAD RASH</div>
    <button class="start-game" onclick="startGame()">START GAME</button>
    <div class="instructions">
      Use Arrow Keys to control<br>
      LEFT/RIGHT: Steer | UP: Accelerate | DOWN: Brake
    </div>
  </div>
  
  <div id="game-container">
    <canvas id="canvas"></canvas>
  </div>

  <script src="js/variables.js"></script>
  <script src="js/math.js"></script>
  <script src="js/gameLoad.js"></script>
  <script src="js/render.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/script.js"></script>
  
  <script>
    function startGame() {
      document.getElementById('menu').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';
      if (typeof init === 'function') {
        init();
      }
    }
  </script>
</body>
</html>
